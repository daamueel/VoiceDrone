[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicedrone"
version = "0.1.0"
description = "Deterministic flight behaviors and PX4 SITL execution for VoiceDrone"
requires-python = ">=3.11"

[project.scripts]
voicedrone-sitl = "flight.run_sitl:main"
voicedrone-analyze = "flight.analyze_sitl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
